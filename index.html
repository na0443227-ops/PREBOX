<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PreBox</title>
<style>
body{margin:0;font-family:Arial;background:#ffffff;color:#000;text-align:center}
.header{background:#ffffff;padding:25px;border-bottom:1px solid #ddd}
.header h1{margin:0;color:#000;font-size:24px}
.logo{width:100px;height:100px;border-radius:50%;object-fit:cover}
.box{background:#f2f2f2;margin:15px;padding:20px;border-radius:15px}
.box h2{margin:0;color:#000}
.free{color:#00a651;font-size:22px;font-weight:normal}
.btn{display:block;background:#25D366;color:white;text-align:center;padding:13px;border-radius:10px;text-decoration:none;font-weight:normal;margin-top:12px}
.cat-btn{padding:10px 18px;border:2px solid #00ff88;background:#fff;border-radius:20px;font-weight:bold;cursor:pointer;margin:5px}
.cat-btn.active{background:#00ff88;color:#000}
.pack{max-width:180px;margin:15px auto;background:#ffffff;border:2px solid #00ff88;border-radius:20px;padding:18px;text-align:center;box-shadow:0 0 25px #00ff8855}
.pack img{width:100%;border-radius:15px;border:1px solid #333}
.d-btn{display:block;background:#00ff88;color:#000;padding:14px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:16px;margin-top:12px}
</style>
</head>
<body>

<input type="text" id="search" placeholder="Search New Packs ..." style="width:90%; padding:12px; border-radius:20px; margin:10px; display:block; margin-left:auto; margin-right:auto;" onkeyup="searchPack()">

<div class="header">
<img class="logo" src="https://drive.google.com/thumbnail?id=1m6yj8CTJxmP5rB7u0RG7WtuoKlcJ6ud5&sz=w1000">
<h1>PreBox</h1>
</div>

<!-- CATEGORY BUTTONS -->
<div style="margin:15px 0;">
<button class="cat-btn active" onclick="filterCat('all',this)">All</button>
<button class="cat-btn" onclick="filterCat('text',this)">Text Effects</button>
<button class="cat-btn" onclick="filterCat('preset',this)">Presets</button>
</div>

<!-- PRESET ITEM - LIGHT CC -->
<div class="pack preset-item" data-cat="preset">
  <h2 style="color:#000;margin:12px 0 5px 0;font-size:20px;letter-spacing:1px;">LIGHT CC</h2>
  <p style="color:#000;font-weight:bold;font-size:12px;margin:0 0 15px 0;">DOWNLOAD & SCAN QR FOR XML FILE</p>
  <img src="https://drive.google.com/thumbnail?id=1SCD7BRqW8ZH7qOS3hMTKZURDVjBLxpxY&sz=w1000" alt="LIGHT CC">
  <a href="https://drive.google.com/file/d/1SCD7BRqW8ZH7qOS3hMTKZURDVjBLxpxY/view?usp=drivesdk" target="_blank" class="d-btn">DOWNLOAD</a>
</div>
<!-- FREE FIRE THUMBNAIL - PRESETS CATEGORY -->
<div class="card" data-cat="preset">
  <img src="https://drive.google.com/uc?export=view&id=1PJ4a2MezT0ZmD5OYc9eiCqZQcdSbVI8K" alt="Free Fire Thumbnail PNG">
  
  <h3>FREE FIRE THUMBNAIL</h3>
  <p>Free Fire Thumbnail PNG | Green Glow Text Effect</p>
  
  <a href="https://drive.google.com/file/d/1PJ4a2MezT0ZmD5OYc9eiCqZQcdSbVI8K/view?usp=drivesdk" target="_blank" class="btn">Download PNG</a>
  
  <a href="https://alightcreative.com/am/share/u/4Z2SVmgW9rXwIxLmOQrqtjKi9Uy1/p/Mkg7WbaSV5-7d871c815d42778f?source=link" target="_blank" class="btn btn2">Get Template</a>
</div>

<!-- TEXT EFFECT ITEM - EXAMPLE -->
<div class="pack preset-item" data-cat="text">
  <h2 style="color:#000;margin:12px 0 5px 0;font-size:20px;">GOLD TEXT EFFECT</h2>
  <p style="color:#000;font-weight:bold;font-size:12px;margin:0 0 15px 0;">PSD TEXT EFFECT - 1 CLICK</p>
  <img src="https://drive.google.com/thumbnail?id=1SCD7BRqW8ZH7qOS3hMTKZURDVjBLxpxY&sz=w1000" alt="Text Effect">
  <a href="https://drive.google.com/file/d/1SCD7BRqW8ZH7qOS3hMTKZURDVjBLxpxY/view?usp=drivesdk" target="_blank" class="d-btn">DOWNLOAD</a>
</div>

<script>
function filterCat(cat, btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.preset-item').forEach(item=>{
    if(cat==='all' || item.getAttribute('data-cat')===cat){
      item.style.display='block';
    } else {
      item.style.display='none';
    }
  });
}
function searchPack(){
  let v = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.preset-item').forEach(item=>{
    let t = item.innerText.toLowerCase();
    item.style.display = t.includes(v) ? 'block' : 'none';
  });
}
</script>

</body>
</html>
